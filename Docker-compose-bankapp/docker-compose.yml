# docker build && docker run
services:
  mysql:
    image: mysql:8.0
    container_name: bankapp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Test@123
      MYSQL_DATABASE: bankappdb
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pTest@123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - 3306:3306
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - bankapp-network
      
  bankapp:
    build: .      # because we build this with the dockerfile
    container_name: bankapp
    ports:
      - "8080:8080"
    environment:
      MYSQL_HOST: bankapp-mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: bankappdb
      MYSQL_USER: root
      MYSQL_PASSWORD: Test@123
      OLLAMA_URL: http://bankapp-ollama:11434
    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - bankapp-network

  ollama:
    image: ollama/ollama
    container_name: bankapp-ollama
    ports:
      - 11434:11434
    networks:
      - bankapp-network
    volumes:
      - ollama-data:/root/.ollama
    


# docker network create
networks:
  bankapp-network:
    driver: bridge

# docker volume create
volumes:
  mysql-data:
  ollama-data: